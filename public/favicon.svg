<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Outer Hexagon Gradient -->
    <linearGradient id="outerHex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Metallic Bevel Gradient -->
    <linearGradient id="metallic" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Cyan Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="cyanCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Outer Hexagonal Frame 'Q' -->
  <polygon points="256,32 440,138 440,350 256,456 72,350 72,138" fill="url(#metallic)" stroke="url(#outerHex)" stroke-width="24" stroke-linejoin="round" />

  <!-- Isometric Inner Glowing Cube Core -->
  <!-- Top Face -->
  <polygon points="256,160 326,200 256,240 186,200" fill="#38bdf8" filter="url(#glow)" />
  <!-- Left Face -->
  <polygon points="186,200 256,240 256,320 186,280" fill="#0284c7" />
  <!-- Right Face -->
  <polygon points="256,240 326,200 326,280 256,320" fill="#0369a1" />

  <!-- Q Tail Accent -->
  <path d="M300,320 L420,440 L350,456 L270,360 Z" fill="url(#cyanCore)" filter="url(#glow)" />
</svg>
